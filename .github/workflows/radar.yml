name: Radar de baneos
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar notificación de prueba"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THRESHOLD: ${{ vars.THRESHOLD || '40' }}
          TEST: ${{ inputs.test && '1' || '' }}
      - run: |
          git config user.name radar
          git config user.email radar@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "estado" && git push)
